{% extends "base.html" %}
{% block title %}Log in - TrustVault{% endblock %}
{% block content %}
<h1>Log in</h1>
<p class="muted">Accounts are created by an administrator.</p>
<form method="post" action="{{ url_for('login') }}" class="card" style="margin-top:20px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username
    <input type="text" name="username" autocomplete="username" required maxlength="50" autofocus>
  </label>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required maxlength="200">
  </label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
