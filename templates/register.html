{% extends "base.html" %}
{% block title %}Register as administrator - TrustVault{% endblock %}
{% block content %}
<h1 class="login-title">Register as administrator</h1>
<form method="post" action="{{ url_for('register') }}" class="login-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Full name
    <input type="text" name="full_name" value="{{ form.get('full_name', '') }}" required maxlength="80" autofocus>
  </label>
  <label>E-mail
    <input type="email" name="email" value="{{ form.get('email', '') }}" required maxlength="120" autocomplete="email">
  </label>
  <label>Username
    <input type="text" name="username" value="{{ form.get('username', '') }}" required minlength="3" maxlength="30" autocomplete="username">
  </label>
  <label>Organisation name
    <input type="text" name="organisation" value="{{ form.get('organisation', '') }}" required maxlength="100">
  </label>
  <label>Password (at least 10 characters)
    <input type="password" name="password" required minlength="10" maxlength="200" autocomplete="new-password">
  </label>
  <label>Confirm password
    <input type="password" name="confirm_password" required minlength="10" maxlength="200" autocomplete="new-password">
  </label>
  <label>Setup code
    <input type="password" name="setup_code" required maxlength="200" autocomplete="off">
  </label>
  <button type="submit">Create administrator</button>
</form>
<p class="login-alt"><a href="{{ url_for('login') }}">Back to sign in</a></p>
{% endblock %}
