{% extends "base.html" %}
{% from "_macros.html" import back %}
{% block title %}Upload - TrustVault{% endblock %}
{% block content %}
{{ back(url_for('documents.list_documents')) }}
<div class="page-head"><div><h1>Upload documents</h1></div></div>
<form id="upload-form" method="post" action="{{ url_for('documents.upload') }}" enctype="multipart/form-data" class="card narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Title (with several files, it is put in front of each file's name)
    <input type="text" name="title" maxlength="120">
  </label>
  <label>Category
    <select name="category" required>{% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select>
  </label>
  <label>Files (pdf, png, jpg, txt, csv, docx or xlsx; up to 100 MB in total)
    <input type="file" name="file" required multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.csv,.docx,.xlsx">
  </label>
  <ul id="file-list" class="file-list" hidden></ul>
  <p id="upload-error" class="flash error" role="alert" hidden></p>
  <button type="submit">Upload</button>
  <div id="upload-status" class="upload-status" role="status" hidden>
    <p id="upload-status-text">Uploading… 0%</p>
    <div class="upload-bar"><span></span></div>
  </div>
</form>
<script src="{{ url_for('static', filename='upload.js') }}" defer></script>
{% endblock %}
