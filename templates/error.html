{% extends "base.html" %}
{% block title %}Error {{ code }} - TrustVault{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <h1>{{ message }}</h1>
  <p class="muted" style="margin-top:10px">If you expected to find something here, ask the person who shared it with you.</p>
  {% if not g.user %}<p><a class="button" href="{{ url_for('login') }}">Sign in</a></p>{% endif %}
</div>
{% endblock %}
